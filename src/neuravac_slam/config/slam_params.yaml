neuravac_slam:
  ros__parameters:
    resolution_m: 0.05
    map_size_m: 20.0
    min_range_m: 0.12
    max_range_m: 8.0
    scan_match_window_m: 0.20
    scan_match_window_deg: 12.0
    map_publish_hz: 2.0
    min_scan_points: 40
    min_match_score: 0.15
    recovery_after_rejections: 3
    recovery_observations: 3
    recovery_max_scans: 30
    # D6 reports clockwise angle values; negate into the ROS CCW plane.
    lidar_angle_sign: -1.0
    # Sensor transform into robot base coordinates; calibrate if off-center.
    lidar_x_offset_m: 0.0
    lidar_y_offset_m: 0.0
    lidar_yaw_offset_deg: 0.0
