neuravac_slam:
  ros__parameters:
    resolution_m: 0.05
    map_size_m: 20.0
    min_range_m: 0.12
    max_range_m: 8.0
    scan_match_window_m: 0.20
    scan_match_window_deg: 12.0
    scan_match_fallback_window_deg: 45.0
    scan_match_fallback_steps: 19
    odom_stale_sec: 1.5
    map_publish_hz: 2.0
    # Reject whole scans instead of adding inconsistent geometry to the map.
    min_scan_overlap: 0.15
    collision_pause_sec: 0.35
    map_file: ~/Neuravac/maps/room.npz
    icp_max_distance_m: 0.20
    icp_min_inlier_ratio: 0.40
    icp_max_rmse_m: 0.10
    recovery_scans: 2
    recovery_window_m: 0.60
    recovery_window_deg: 60.0

    # Require consistent LiDAR alignment before inserting scans after contact.
    use_icp_recovery: true
    # Map insertion checks are independent of live marker updates.
    min_mapping_agreement: 0.55
    mapping_tolerance_m: 0.12
    max_mapping_turn_deg: 2.5
    max_mapping_translation_m: 0.10
