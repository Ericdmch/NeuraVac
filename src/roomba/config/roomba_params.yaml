roomba_node:
  ros__parameters:
    # Physical USB port path for the Roomba cable on the Pi (or /dev/neuravac_roomba after re-running udev setup)
    serial_port: /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1:1.0-port0
    baudrate: 115200
    sensor_query_hz: 10.0
    # Nominal Roomba 650/Create 2 geometry; calibrate against measured travel.
    wheel_diameter_m: 0.072
    encoder_counts_per_rev: 508.8
    wheel_track_m: 0.235
    left_wheel_scale: 1.0
    right_wheel_scale: 1.0
    max_wheel_speed_m_s: 0.6
    query_timeout_sec: 0.35
    startup_delay_sec: 2.0
    min_obstacle_distance_m: 0.10
    autonomous_max_wheel_speed_m_s: 0.45
