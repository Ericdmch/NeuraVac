[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuravac"
version = "0.1.0"
description = "Roomba sensor and web control tools"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1",
    "openai>=1.0",
    "pygame>=2.6",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuravac*"]
