[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuravac"
version = "0.1.0"
description = "Neuravac Roomba ROS 2 node and Flask web interface"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
