[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuravac"
version = "0.1.0"
description = "Semantic robot vacuum with deterministic safety and verified cleaning"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "httpx>=0.27,<1", "fastapi>=0.115,<0.136", "starlette>=0.46,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "numpy>=1.26,<2.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.13,<2", "types-PyYAML", "pre-commit>=4,<5", "Pillow>=10,<13", "opencv-python-headless>=4.10,<4.13"]
hardware = ["pyserial>=3.5,<4"]
vision = ["onnxruntime>=1.19,<2", "opencv-python-headless>=4.10,<4.13", "Pillow>=10,<13"]
training = ["ultralytics>=8.3,<9", "onnx>=1.17,<2"]

[project.scripts]
neuravac = "neuravac_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["neuravac_core", "sim", "dashboard", "datasets", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not hardware and not cloud'"
markers = ["hardware: explicit physical hardware tests", "cloud: opt-in billed cloud calls"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["neuravac_core", "sim", "dashboard/backend"]
check_untyped_defs = true
ignore_missing_imports = true
