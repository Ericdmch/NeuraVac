<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuraVac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='canvas.js') }}" defer></script>
    <script src="{{ url_for('static', filename='serial-monitor.js') }}" defer></script>
</head>
<body>
    <div class="side-bar">
        <div class="side-bar-title">
            NeruaVac
        </div>
        <div class="side-bar-line"></div>
        <div class="side-bar-item">
            Home
        </div>
        <div class="side-bar-item">
            About
        </div>
        
    </div>

    <div class="main-content">

        <!-- Live Camera View -->
        <div id="camera-view" class="content-card" style="display: none;">
            <div class="content-card-title">
                <span class="content-card-title-text">Camera View</span>
                <span id="camera-status"></span>
            </div>
            <div class="content-card-line"></div>
            <div id="camera-container">
            <canvas id="camera-canvas" width="800" height="640"></canvas>
            </div>
        </div>

        
         <!-- LIDAR Canvas -->
        <div id="lidar" class="content-card">
            <div class="content-card-title">
                <span class="content-card-title-text">LIDAR View</span>
                <span id="lidar-status"></span>
            </div>
            <div class="content-card-line"></div>
            <div id="lidar-container">
            <canvas id="lidar-canvas" width="800" height="640"></canvas>
            </div>
        </div>

        <!-- Remote override controls -->
        <div id="remote-override-card" class="content-card">
            <div class="content-card-title">
                <span class="content-card-title-text">Remote Override</span>
                <span id="remote-override-status"></span>
            </div>
            <div class="content-card-line"></div>
            <div id="remote-key-grid">
                <button id="remote-key-q" type="button">Q</button>
                <button id="remote-key-w" type="button">W</button>
                <button id="remote-key-e" type="button">E</button>
                <button id="remote-key-a" type="button">A</button>
                <button id="remote-key-s" type="button">S</button>
                <button id="remote-key-d" type="button">D</button>
            </div>
        </div>

        <!-- Serial monitor -->
        <div id="serial-monitor-card" class="content-card">
            <div class="content-card-title">
                <span class="content-card-title-text">Serial Disconnected</span>
                <span id="serial-monitor-status"></span>
            </div>
            <div class="content-card-line"></div>
            <div id="serial-monitor-out"></div>
            <div id="serial-monitor-in">
                <span id="serial-monitor-prompt">&gt;</span>
                <input type="text" disabled>
            </div>
        </div>

    </div>
</body>
</html>
