repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: secret-audit
        name: NeuraVac source secret audit
        entry: .venv/bin/python -m tools.audit_secrets
        language: system
        pass_filenames: true
